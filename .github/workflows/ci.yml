name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'scripts/meta-*'
      - 'scripts/reel-director-*'
      - 'scripts/reel-renderer-*'
      - 'scripts/reel-render-jobs-*'
      - 'scripts/reel-sandbox-*'
      - 'infra/reel-render-sandbox/**'
      - 'api/**'
      - 'server/reel-render-jobs/**'
      - 'server/reel-renderer/**'
      - 'server/reel-sandbox-runner/**'
      - 'server/reel-sandbox-runtime/**'
      - 'src/components/portal/AiAssistantPage.tsx'
      - 'src/components/portal/ReelPreview.tsx'
      - 'src/features/reel-director/**'
      - 'src/features/reel-render-jobs/**'
      - 'src/styles/base.css'
      - 'src/components/portal/FacebookPublishPanel.tsx'
      - 'src/features/meta-publishing/**'
      - 'supabase/functions/_shared/meta-publishing/**'
      - 'supabase/functions/_shared/media-analysis/**'
      - 'supabase/functions/_shared/reel-engine/**'
      - 'supabase/functions/_shared/content-engine/providers/openai.js'
      - 'supabase/functions/ai-content-generate/**'
      - 'supabase/functions/ai-media-analyze/**'
      - 'supabase/functions/meta-social-publish/**'
      - 'supabase/functions/meta-social-publish-scheduled-worker/**'
      - 'supabase/migrations/**meta_facebook**.sql'
      - 'supabase/migrations/**reel**.sql'
      - 'supabase/schema.sql'
  push:
    branches:
      - codex/meta-facebook-single-photo-publish-pr1

permissions:
  contents: read

jobs:
  meta-publishing-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm

      - name: Install
        run: npm ci

      - name: Meta publishing regression
        run: npm run test:meta-publishing

      - name: Meta publishing security scan
        run: npm run test:meta-publishing-scan

      - name: AI Reel Director regression and security
        run: npm run test:reel-director

      - name: Durable Reel render jobs regression and security
        run: npm run test:reel-render-jobs && npm run test:reel-render-jobs-scan

      - name: Typecheck
        run: npx tsc -b

  meta-publishing-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm

      - name: Install
        run: npm ci

      - name: Meta publishing SQL
        run: npm run test:meta-publishing-sql && npm run test:reel-director-sql && npm run test:reel-render-jobs-sql

  meta-image-sanitizer-deno:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.1.4'

      - name: Deno version
        run: deno --version

      - name: Check sanitizer module
        run: deno check --allow-import supabase/functions/_shared/meta-publishing/imageProcessor.js

      - name: Real ImageScript sanitizer fixtures
        run: deno test --allow-import --allow-net=deno.land scripts/meta-image-sanitizer-deno-tests.ts

      - name: Check scheduled worker Edge entrypoint
        run: deno check supabase/functions/meta-social-publish-scheduled-worker/index.ts

      - name: Check Meta publishing Edge entrypoint
        run: deno check supabase/functions/meta-social-publish/index.ts

      - name: Check AI Reel Director Edge entrypoint
        run: deno check supabase/functions/ai-content-generate/index.ts

      - name: Check media analysis Edge entrypoint
        run: deno check supabase/functions/ai-media-analyze/index.ts

      - name: Scheduled worker secret auth
        run: deno test --allow-import --allow-net=deno.land scripts/meta-scheduled-worker-deno-tests.ts

  full-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm

      - name: Install
        run: npm ci

      - name: Full build
        run: npm run build

  reel-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm

      - name: Install
        run: npm ci

      - name: Ensure FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Reel renderer regression and real fixture
        env:
          REEL_RENDER_REAL_FIXTURE: '1'
          REEL_RENDER_ARTIFACT_DIR: ${{ runner.temp }}/ai-reel-renderer-fixture
        run: npm run test:reel-renderer

      - name: Reel renderer security scan
        run: npm run test:reel-renderer-scan

      - name: Upload Reel renderer fixture
        uses: actions/upload-artifact@v4
        with:
          name: ai-reel-renderer-fixture
          path: ${{ runner.temp }}/ai-reel-renderer-fixture/
          if-no-files-found: error
          retention-days: 7

  reel-sandbox-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify qualified FFmpeg renderer source unchanged
        run: git diff --exit-code 97da68e07ad1723e75c28e02543b937b5b323778 HEAD -- server/reel-renderer ':!server/reel-renderer/authorization.js' ':!server/reel-renderer/errors.js'

      - name: Sandbox runtime regression and security
        run: npm run test:reel-sandbox-runtime && npm run test:reel-sandbox-runtime-scan

      - name: Build qualified Sandbox image without push
        run: |
          BASE_IMAGE="node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436"
          # This tag is a temporary build locator; runtime configuration accepts only the resolved OCI digest.
          docker pull "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" --format 'base={{index .RepoDigests 0}}'
          docker build \
            --file infra/reel-render-sandbox/Dockerfile \
            --build-arg "REEL_SOURCE_SHA=${GITHUB_SHA}" \
            --build-arg "REEL_RUNNER_CONTRACT_VERSION=reel-sandbox-authority-v1" \
            --tag "servicescope-reel-renderer:v2-${GITHUB_SHA}" \
            .
          docker image inspect "servicescope-reel-renderer:v2-${GITHUB_SHA}" --format 'image_id={{.Id}} os={{.Os}} architecture={{.Architecture}}'

      - name: Verify Sandbox image source provenance
        run: |
          IMAGE="servicescope-reel-renderer:v2-${GITHUB_SHA}"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.servicescope.reel.runner-contract" }}')" = "reel-sandbox-authority-v1"
          for FILE in \
            server/reel-sandbox-runner/runner.js \
            server/reel-renderer/authorization.js \
            server/reel-renderer/errors.js \
            server/reel-sandbox-runtime/contracts.js \
            supabase/functions/_shared/reel-engine/schemas.js
          do
            HOST_SHA="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            IMAGE_SHA="$(docker run --rm --entrypoint sha256sum "$IMAGE" "/app/$FILE" | cut -d ' ' -f 1)"
            test "$HOST_SHA" = "$IMAGE_SHA"
            echo "$FILE sha256=$HOST_SHA"
          done

      - name: Verify Sandbox image contains no secret material
        run: |
          IMAGE="servicescope-reel-renderer:v2-${GITHUB_SHA}"
          IMAGE_ENV="$(docker image inspect "$IMAGE" --format '{{json .Config.Env}}')"
          ! printf '%s' "$IMAGE_ENV" | grep -Eiq '(TOKEN|SECRET|PASSWORD|PRIVATE_KEY|SUPABASE|OPENAI|META_)'
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -z "$(find /app -type f \( -name ".env" -o -name ".env.*" -o -name "id_rsa" -o -name "id_ed25519" -o -name "credentials" -o -path "*/.git/*" -o -path "*/.ssh/*" \) -print -quit)"'

      - name: Record FFmpeg package and license evidence
        run: |
          IMAGE="servicescope-reel-renderer:v2-${GITHUB_SHA}"
          docker run --rm "$IMAGE" /usr/bin/ffmpeg -version
          docker run --rm "$IMAGE" /usr/bin/ffmpeg -buildconf
          docker run --rm "$IMAGE" /usr/bin/ffmpeg -L
          docker run --rm "$IMAGE" /usr/bin/ffprobe -version
          docker run --rm "$IMAGE" dpkg-query -W -f='${Package}=${Version}\n' ffmpeg
          docker run --rm "$IMAGE" sh -c "dpkg-query -W -f='\${Package}=\${Version}\\n' 'libx264*'"
          docker run --rm "$IMAGE" sh -c "ffmpeg -buildconf 2>&1 | grep -- '--enable-gpl'"
          docker run --rm "$IMAGE" sh -c "test -f /usr/share/doc/ffmpeg/copyright && find /usr/share/doc -maxdepth 2 -path '*x264*/copyright' -print"

      - name: Isolated synthetic runner end-to-end
        run: |
          FIXTURE_ROOT="${RUNNER_TEMP}/servicescope-reel-sandbox-fixture"
          node scripts/reel-sandbox-container-tests.mjs prepare "$FIXTURE_ROOT"
          chmod -R a+rwX "$FIXTURE_ROOT"
          START_SECONDS=$SECONDS
          docker run --rm \
            --network none \
            --cpus 1 \
            --memory 2g \
            --pids-limit 256 \
            --volume "$FIXTURE_ROOT:/vercel/sandbox/reel" \
            "servicescope-reel-renderer:v2-${GITHUB_SHA}"
          echo "wall_seconds=$((SECONDS - START_SECONDS))"
          node scripts/reel-sandbox-container-tests.mjs verify "$FIXTURE_ROOT"
