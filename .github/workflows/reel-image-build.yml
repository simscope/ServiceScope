name: Reel image build and push

on:
  push:
    branches: [ops/reel-image-build-d45d05b]

permissions: {}

jobs:
  oidc-workflow-name-exchange:
    if: github.repository == 'simscope/ServiceScope' && github.ref == 'refs/heads/ops/reel-image-build-d45d05b'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: One VCR OIDC login using workflow-name diagnostic policy
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}
          policy: pol_96f9db0b-6e28-4896-889d-a3b63f4c2e3d
          audience: https://github.com/simscope
          engines: docker
          logout: 'true'
          revoke: 'true'
