name: Reel image build and push

on:
  push:
    branches: [ops/reel-image-build-d45d05b]

permissions: {}

jobs:
  build-and-push:
    if: github.repository == 'simscope/ServiceScope' && github.ref == 'refs/heads/ops/reel-image-build-d45d05b'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    env:
      CANDIDATE_SOURCE_SHA: d45d05b67f6612f3509076291f045b66b0c96eb3
      IMAGE: servicescope-reel-renderer:v2-d45d05b67f6612f3509076291f045b66b0c96eb3
      REGISTRY_IMAGE: vcr.vercel.com/andrei-simanenkas-projects/servicescope/servicescope-reel-renderer:v2-d45d05b67f6612f3509076291f045b66b0c96eb3
    steps:
      - name: Checkout exact approved image source
        uses: actions/checkout@v4
        with:
          ref: d45d05b67f6612f3509076291f045b66b0c96eb3
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'

      - name: Prepare exact candidate source manifest
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
          node scripts/reel-candidate-manifest.mjs prepare
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const m=JSON.parse(fs.readFileSync('infra/reel-render-sandbox/candidate-manifest.json'));assert.equal(m.sourceSha,process.env.CANDIDATE_SOURCE_SHA);assert.equal(m.entries.length,36);"
          echo "CANDIDATE_MANIFEST_SHA=$(sha256sum infra/reel-render-sandbox/candidate-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Log in to VCR before image build
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}
          policy: pol_8eed71af-9397-49b3-aa90-17e1c4f01aa6
          audience: https://github.com/simscope
          engines: docker
          logout: 'true'
          revoke: 'true'

      - name: Build exactly one linux amd64 image
        run: |
          BASE_IMAGE="node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436"
          docker pull --platform linux/amd64 "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" --format 'base={{index .RepoDigests 0}}'
          docker build --platform linux/amd64 \
            --file infra/reel-render-sandbox/Dockerfile \
            --build-arg "REEL_SOURCE_SHA=${CANDIDATE_SOURCE_SHA}" \
            --build-arg REEL_RUNNER_CONTRACT_VERSION=reel-sandbox-authority-v1 \
            --build-arg "REEL_CANDIDATE_MANIFEST_SHA=${CANDIDATE_MANIFEST_SHA}" \
            --tag "$IMAGE" .
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64

      - name: Verify source provenance and all 36 inputs
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$CANDIDATE_SOURCE_SHA"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.servicescope.reel.runner-contract" }}')" = reel-sandbox-authority-v1
          node scripts/reel-candidate-manifest.mjs verify "$IMAGE" | tee candidate-image-evidence.json
          for FILE in server/reel-sandbox-runner/runner.js server/reel-renderer/authorization.js server/reel-renderer/errors.js server/reel-sandbox-runtime/contracts.js supabase/functions/_shared/reel-engine/manualPlanContract.js supabase/functions/_shared/reel-engine/schemas.js
          do
            HOST_SHA="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            IMAGE_SHA="$(docker run --rm --network none --entrypoint sha256sum "$IMAGE" "/app/$FILE" | cut -d ' ' -f 1)"
            test "$HOST_SHA" = "$IMAGE_SHA"
          done

      - name: Verify image contains no secret material
        run: |
          IMAGE_ENV="$(docker image inspect "$IMAGE" --format '{{json .Config.Env}}')"
          ! printf '%s' "$IMAGE_ENV" | grep -Eiq '(TOKEN|SECRET|PASSWORD|PRIVATE_KEY|SUPABASE|OPENAI|META_)'
          docker run --rm --network none --entrypoint sh "$IMAGE" -c 'test -z "$(find /app -type f \( -name ".env" -o -name ".env.*" -o -name "id_rsa" -o -name "id_ed25519" -o -name "credentials" -o -path "*/.git/*" -o -path "*/.ssh/*" \) -print -quit)"'

      - name: Publish the verified image exactly once
        run: |
          docker tag "$IMAGE" "$REGISTRY_IMAGE"
          docker push "$REGISTRY_IMAGE" | tee registry-push.txt
          docker image inspect "$REGISTRY_IMAGE" --format '{{json .RepoDigests}}' > registry-digests.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const repository=process.env.REGISTRY_IMAGE.split(':')[0];
          const refs=JSON.parse(fs.readFileSync('registry-digests.json'));
          const reference=refs.find(r=>r.startsWith(repository+'@sha256:'));
          assert(reference && /^sha256:[0-9a-f]{64}$/.test(reference.split('@')[1]));
          const image=JSON.parse(execFileSync('docker',['image','inspect',process.env.IMAGE],{encoding:'utf8'}))[0];
          const evidence={workflowRun:process.env.GITHUB_RUN_ID,workflowSha:process.env.GITHUB_SHA,sourceSha:process.env.CANDIDATE_SOURCE_SHA,localImageId:image.Id,registryReference:reference,registryDigest:reference.split('@')[1],platform:'linux/amd64',manifestSha256:process.env.CANDIDATE_MANIFEST_SHA,verifiedInputs:36,oidcLogin:'PASS',provenance:'PASS',secretScan:'PASS',imageBuilds:1,registryPublications:1};
          fs.writeFileSync('registry-image-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence));
          NODE

      - name: Preserve only safe image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-registry-image-evidence
          path: |
            infra/reel-render-sandbox/candidate-manifest.json
            candidate-image-evidence.json
            registry-image-evidence.json
            registry-digests.json
            registry-push.txt
          if-no-files-found: warn
